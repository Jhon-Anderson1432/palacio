name: Sincronización General Completa (Manual o Cada 3 Días)

on:
  schedule:
    # Ejecuta automáticamente cada 3 días a las 04:00 UTC (11:00 PM hora Colombia)
    - cron: '0 4 */3 * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente en cualquier momento desde GitHub Actions con un solo clic

jobs:
  sync-general:
    name: Sincronizar Todas las Tablas, Auth y Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del script
        working-directory: ./scripts
        run: npm install

      - name: Ejecutar Sincronización General
        working-directory: ./scripts
        env:
          PRIMARY_SUPABASE_URL: ${{ secrets.PRIMARY_SUPABASE_URL }}
          PRIMARY_SERVICE_ROLE_KEY: ${{ secrets.PRIMARY_SERVICE_ROLE_KEY }}
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SERVICE_ROLE_KEY }}
        run: node sync-general.mjs
